<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Public Tennis Courts</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root { --bg: #f4f6f9; --card: #ffffff; --text: #16202c; --muted: #5b6878; --accent: #2f6f4f; --line: #d9dee5; }
  @media (prefers-color-scheme: dark) { :root { --bg: #11161d; --card: #1a212b; --text: #e8edf3; --muted: #9aa7b6; --accent: #6fcf97; --line: #2a3340; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 15px/1.4 system-ui, -apple-system, Segoe UI, sans-serif; }
  .app { display: grid; grid-template-columns: 340px 1fr; height: 100%; }
  aside { overflow: auto; border-right: 1px solid var(--line); background: var(--card); }
  header { padding: 16px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--card); z-index: 1; }
  h1 { font-size: 18px; margin: 0 0 8px; }
  .bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  button.chip { min-height: 40px; padding: 6px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); color: var(--text); font: inherit; font-weight: 600; cursor: pointer; }
  a.chip { display: inline-flex; align-items: center; text-decoration: none; min-height: 40px; padding: 6px 14px; border-radius: 999px; border: 1px solid var(--line); color: var(--text); font-weight: 600; font-size: 14px; }
  button.chip[aria-pressed="true"] { background: var(--accent); color: #fff; border-color: var(--accent); }
  .count { color: var(--muted); font-size: 13px; }
  #q { width: 100%; margin-top: 10px; min-height: 40px; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--text); font: inherit; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .dist { color: var(--muted); font-size: 13px; }
  ul { list-style: none; margin: 0; padding: 8px; }
  li button { width: 100%; text-align: left; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); color: var(--text); font: inherit; margin-bottom: 6px; cursor: pointer; }
  li button:hover, li button[aria-current="true"] { border-color: var(--accent); }
  .meta { color: var(--muted); font-size: 13px; }
  #map { height: 100%; }
  .pop img { width: 220px; max-width: 100%; border-radius: 8px; display: block; margin-bottom: 6px; }
  .pop a, a.gm { color: var(--accent); font-weight: 600; }
  .pop .links { display: flex; gap: 14px; margin-top: 4px; }
  li { position: relative; }
  li button { padding-right: 118px; }
  a.gm { position: absolute; right: 12px; top: 12px; font-size: 13px; text-decoration: none; padding: 4px 0; }
  footer { padding: 12px 16px; color: var(--muted); font-size: 12px; }
  @media (max-width: 720px) { .app { grid-template-columns: 1fr; grid-template-rows: 55vh 45vh; } aside { order: 2; border-right: 0; border-top: 1px solid var(--line); } }
</style>
</head>
<body>
<div class="app">
  <aside>
    <header>
      <h1>Public Tennis Courts</h1>
      <div class="bar" id="areas" role="tablist" aria-label="Area"></div>
      <label class="sr" for="q">Search courts by name</label>
      <input id="q" type="search" placeholder="Search by name" autocomplete="off">
      <div class="bar" style="margin-top:8px" role="group" aria-label="Type">
        <button class="chip" data-kind="Park" aria-pressed="true">Parks</button>
        <button class="chip" data-kind="School" aria-pressed="true">Schools</button>
        <button class="chip" data-kind="Club" aria-pressed="true">Clubs</button>
        <button class="chip" data-kind="Unverified" aria-pressed="true">Unverified</button>
      </div>
      <div class="bar" style="margin-top:8px">
        <button class="chip" id="lights" aria-pressed="false">Lights likely</button>
        <button class="chip" id="confirmed" aria-pressed="false">Confirmed only</button>
        <button class="chip" id="multi" aria-pressed="false">2+ courts</button>
        <button class="chip" id="near" aria-pressed="false">Near me</button>
        <span class="count" id="count"></span>
      </div>
    </header>
    <ul id="list" aria-label="Courts"></ul>
    <footer>Courts found in public USDA NAIP aerial imagery; may be inaccurate. Map © OpenStreetMap contributors.</footer>
  </aside>
  <div id="map" role="region" aria-label="Map"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(function () {
  var map = L.map("map", { zoomControl: true });
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "© OpenStreetMap contributors" }).addTo(map);
  var all = [], markers = {}, sel = null, me = null;
  var F = { kinds: { Park: true, School: true, Club: true, Unverified: true }, lights: false, confirmed: false, multi: false, q: "" };
  try { var saved = JSON.parse(localStorage.getItem("filters") || "null"); if (saved && saved.kinds) { F = saved; F.q = ""; if (!("Unverified" in F.kinds)) F.kinds.Unverified = true; } } catch (e) {}
  function save() { try { localStorage.setItem("filters", JSON.stringify(F)); } catch (e) {} }
  function kindOf(c) { return c.kind || "Park"; }
  function km(a, b, c, d) { var r = Math.PI / 180, x = (d - b) * r * Math.cos((a + c) / 2 * r), y = (c - a) * r; return 6371 * Math.sqrt(x * x + y * y); }
  function passes(c) {
    if (!F.kinds[kindOf(c)]) return false;
    if (F.lights && c.lights !== "likely") return false;
    if (F.confirmed && !c.confirmed) return false;
    if (F.multi && !(c.courts > 1)) return false;
    if (F.q && c.name.toLowerCase().indexOf(F.q) < 0) return false;
    return true;
  }
  function el(t, a, kids) { var n = document.createElement(t); for (var k in a || {}) { if (k === "text") n.textContent = a[k]; else n.setAttribute(k, a[k]); } (kids || []).forEach(function (c) { n.appendChild(c); }); return n; }
  // Named sites search the place by name near its coordinates, so Google opens the park's listing (with "Popular
  // times" when Google has it); unnamed sites open a pin. Only a link the visitor taps: nothing is fetched or scraped.
  function named(c) { return !/^(Park court|School court|Club court|Courts \(unverified\))$/.test(c.name); }
  function gmaps(c) {
    var q = named(c) ? c.name + " " + c.lat.toFixed(4) + "," + c.lon.toFixed(4) : c.lat + "," + c.lon;
    return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(q);
  }
  function label(c) { return c.name + (c.courts > 1 ? " · " + c.courts + " courts" : ""); }
  function kindNote(c) {
    if (c.kind === "Unverified") return "Unverified: probably public, not checked · ";
    return c.kind && c.kind !== "Park" ? c.kind + " (open to public, checked) · " : "";
  }
  function popup(c) {
    var box = el("div", { class: "pop" });
    if (c.photo) box.appendChild(el("img", { src: c.photo, alt: "Aerial view of " + c.name, loading: "lazy" }));
    box.appendChild(el("strong", { text: label(c) }));
    box.appendChild(el("div", { class: "meta", text: (c.lights === "likely" ? "Lights likely" : "Lights unknown") + (c.confirmed ? " · confirmed" : "") }));
    box.appendChild(el("div", { class: "links" }, [
      el("a", { href: gmaps(c), target: "_blank", rel: "noopener", text: named(c) ? "Busy times on Google Maps" : "Open in Google Maps" }),
      el("a", { href: "https://www.google.com/maps/dir/?api=1&destination=" + c.lat + "," + c.lon, target: "_blank", rel: "noopener", text: "Directions" })
    ]));
    return box;
  }
  function render() {
    var show = all.filter(passes);
    if (me) show.sort(function (a, b) { return km(me[0], me[1], a.lat, a.lon) - km(me[0], me[1], b.lat, b.lon); });
    var list = document.getElementById("list"); list.replaceChildren();
    Object.keys(markers).forEach(function (k) { map.removeLayer(markers[k]); }); markers = {};
    show.forEach(function (c) {
      var m = L.marker([c.lat, c.lon], { title: label(c) }).bindPopup(function () { return popup(c); }).addTo(map); markers[c.n] = m;
      var dist = me ? " · " + (km(me[0], me[1], c.lat, c.lon) / 1.609).toFixed(1) + " mi" : "";
      var b = el("button", { type: "button" }, [el("div", { text: label(c) }), el("div", { class: "meta", text: kindNote(c) + (c.lights === "likely" ? "Lights likely" : "Lights unknown") + dist })]);
      b.addEventListener("click", function () { map.setView([c.lat, c.lon], 18); m.openPopup(); });
      var g = el("a", { class: "gm", href: gmaps(c), target: "_blank", rel: "noopener", "aria-label": "Open " + label(c) + " in Google Maps", text: "Google Maps ↗" });
      list.appendChild(el("li", {}, [b, g]));
    });
    document.getElementById("count").textContent = show.length + " of " + all.length + " courts";
  }
  function syncChips() {
    Array.prototype.forEach.call(document.querySelectorAll("[data-kind]"), function (b) { b.setAttribute("aria-pressed", String(!!F.kinds[b.dataset.kind])); });
    ["lights", "confirmed", "multi"].forEach(function (k) { document.getElementById(k).setAttribute("aria-pressed", String(F[k])); });
    document.getElementById("near").setAttribute("aria-pressed", String(!!me));
  }
  Array.prototype.forEach.call(document.querySelectorAll("[data-kind]"), function (b) {
    b.addEventListener("click", function () { F.kinds[b.dataset.kind] = !F.kinds[b.dataset.kind]; save(); syncChips(); render(); });
  });
  ["lights", "confirmed", "multi"].forEach(function (k) {
    document.getElementById(k).addEventListener("click", function () { F[k] = !F[k]; save(); syncChips(); render(); });
  });
  document.getElementById("q").addEventListener("input", function () { F.q = this.value.trim().toLowerCase(); render(); });
  document.getElementById("near").addEventListener("click", function () {   // location stays in this browser; nothing is sent
    if (me) { me = null; syncChips(); render(); return; }
    if (!navigator.geolocation) return;
    navigator.geolocation.getCurrentPosition(function (p) { me = [p.coords.latitude, p.coords.longitude]; syncChips(); render(); map.setView(me, 13); },
      function () { alert("Location not available. Allow location access to sort by distance."); }, { timeout: 10000 });
  });
  syncChips();
  function loadArea(a, btns) {
    btns.forEach(function (b) { b.setAttribute("aria-pressed", String(b.dataset.file === a.file)); });
    try { localStorage.setItem("area", a.file); } catch (e) {}
    fetch(a.file).then(function (r) { return r.json(); }).then(function (d) {
      all = d;
      if (d.length) map.fitBounds(d.map(function (c) { return [c.lat, c.lon]; }), { padding: [30, 30] }); else map.setView([37.5, -120], 6);
      render();
    });
  }
  fetch("areas.json").then(function (r) { return r.json(); }).then(function (areas) {
    var bar = document.getElementById("areas"), btns = [], saved = null;
    try { saved = localStorage.getItem("area"); } catch (e) {}
    areas.forEach(function (a) {
      var b = el("button", { type: "button", class: "chip", role: "tab", "data-file": a.file, text: a.label + " (" + a.count + ")" });
      b.addEventListener("click", function () { loadArea(a, btns); });
      btns.push(b); bar.appendChild(b);
    });
    var first = areas.filter(function (a) { return a.file === saved; })[0] || areas[0];
    if (first) loadArea(first, btns);
  });
})();
</script>
</body>
</html>
